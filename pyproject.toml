[project]
name = "kamma-sync"
version = "0.1.0"
description = "Sync Kamma commands into supported AI CLI installs"
requires-python = ">=3.11"
dependencies = ["rich"]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pyright>=1.1.410",
    "pytest>=8.0",
    "ruff>=0.15.17",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
# hooks/ is not a package; the tests import kamma_gate after a sys.path insert.
extraPaths = ["hooks"]
