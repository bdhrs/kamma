repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff lint
        entry: uv run --with ruff ruff check --fix
        language: system
        types: [python]

      - id: ruff-format
        name: ruff format
        entry: uv run --with ruff ruff format
        language: system
        types: [python]

      - id: pyright
        name: pyright
        entry: uv run --project kammika --with pyright pyright kammika/kammika scripts/sync.py
        language: system
        types: [python]
        pass_filenames: false
